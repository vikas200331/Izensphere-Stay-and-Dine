<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 100" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37"/>
      <stop offset="50%" stop-color="#C49A45"/>
      <stop offset="100%" stop-color="#AA8232"/>
    </linearGradient>
    <linearGradient id="navyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A63"/>
      <stop offset="100%" stop-color="#142B49"/>
    </linearGradient>
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.12" flood-color="#142B49"/>
    </filter>
  </defs>

  <!-- Emblem / Crest -->
  <g transform="translate(10, 6)" filter="url(#subtleShadow)">
    <!-- Outer Shield / Circle Base -->
    <circle cx="44" cy="44" r="42" fill="url(#navyGrad)"/>
    <circle cx="44" cy="44" r="39" fill="none" stroke="url(#goldGrad)" stroke-width="2.5"/>
    <circle cx="44" cy="44" r="35" fill="none" stroke="rgba(196,154,69,0.3)" stroke-width="1" stroke-dasharray="2,3"/>

    <!-- Fork & Knife Crest -->
    <!-- Cloche dome -->
    <path d="M28 47 Q44 26 60 47 Z" fill="url(#goldGrad)"/>
    <circle cx="44" cy="24" r="3.5" fill="url(#goldGrad)"/>
    <rect x="25" y="48" width="38" height="3.5" rx="1.75" fill="url(#goldGrad)"/>

    <!-- Stem and Base plate -->
    <path d="M42 53 H46 V61 H42 Z" fill="url(#goldGrad)"/>
    <path d="M34 62 Q44 65 54 62 L56 64 Q44 68 32 64 Z" fill="url(#goldGrad)"/>

    <!-- Star sparkles -->
    <polygon points="44,14 45.5,18 49.5,19.5 45.5,21 44,25 42.5,21 38.5,19.5 42.5,18" fill="#FFF"/>
  </g>

  <!-- Text: Brand Name & Tagline -->
  <g transform="translate(112, 0)">
    <!-- Main Title: IZENSPHERE STAY AND DINE -->
    <text x="0" y="52" font-family="'Cinzel', 'Playfair Display', 'Trajan Pro', 'Georgia', serif" font-size="28" font-weight="800" fill="#142B49" letter-spacing="1.5">
      IZENSPHERE
    </text>
    <text x="206" y="52" font-family="'Cinzel', 'Playfair Display', 'Trajan Pro', 'Georgia', serif" font-size="28" font-weight="500" fill="#C49A45" letter-spacing="1.8">
      STAY AND DINE
    </text>

    <!-- Tagline: A WORLD OF FLAVOURS with diamond dividers -->
    <line x1="2" y1="67" x2="88" y2="67" stroke="#C49A45" stroke-width="1.2" stroke-opacity="0.6"/>
    <polygon points="96,67 99,64 102,67 99,70" fill="#C49A45"/>
    <text x="110" y="71" font-family="'Montserrat', 'Inter', 'Helvetica Neue', sans-serif" font-size="12" font-weight="600" fill="#C49A45" letter-spacing="3.8">
      A WORLD OF FLAVOURS
    </text>
    <polygon points="346,67 349,64 352,67 349,70" fill="#C49A45"/>
    <line x1="360" y1="67" x2="450" y2="67" stroke="#C49A45" stroke-width="1.2" stroke-opacity="0.6"/>
  </g>
</svg>
